rules {
    BLOCKLIST_DOMAIN = {
        blacklist = true;
        valid_spf = false;
        valid_dkim = false;
        valid_dmarc = false;
        domains = "/etc/rspamd/domain-blocklist.map";
        score = 5.0;
    }

    BLOCKLIST_DKIM = {
        valid_spf = true;
        valid_dkim = true;
        blacklist = true;
        domains = "/etc/rspamd/domain-blocklist.map";
        score = 12.0;
    }

    ALLOWLIST_DMARC_DKIM = {
        valid_dkim = true;
        valid_dmarc = true;
        strict = true;
        domains = "/etc/rspamd/domain-allowlist.map";
        score = -3.0;
    }

    ALLOWLIST_SPF = {
        valid_spf = true;
        domains = "/etc/rspamd/domain-allowlist.map";
        score = -1;
    }
}
