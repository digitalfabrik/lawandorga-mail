rules {
  ip_reputation = {
    selector "ip" {
    }
    backend "redis" {
      servers = "127.0.0.1";
    }
    symbol = "IP_REPUTATION";
  }

  spf_reputation =  {
    selector "spf" {
    }
    backend "redis" {
      servers = "127.0.0.1";
    }
    symbol = "SPF_REPUTATION";
  }

  dkim_reputation =  {
    selector "dkim" {
    }
    backend "redis" {
      servers = "127.0.0.1";
    }
    symbol = "DKIM_REPUTATION";
  }

  generic_reputation =  {
    selector "generic" {
      selector = "ip";
    }
    backend "redis" {
      servers = "127.0.0.1";
    }
    symbol = "GENERIC_REPUTATION";
  }
}
